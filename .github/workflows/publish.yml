name: Publish

# Push a tag like v0.1.1 (it must match package.json's version) to publish to npm.
# npm Trusted Publishing (OIDC): no npm token is stored here, and npm adds provenance.
# npm stages the version. A maintainer approves it on npmjs.com or with `npm stage approve <id>`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings > Environments) to gate each release.
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 12 or later.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      # Scripts do not run here (check already ran): no dev dependency runs while the job can publish.
      - run: npm stage publish --access public --ignore-scripts
